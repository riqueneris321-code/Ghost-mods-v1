
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>GHOST MODS V1</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
      text-align: center;
    }
    header {
      padding: 28px 15px;
      background: linear-gradient(135deg,#101b2e,#171020);
      border-bottom: 2px solid #a855f7;
    }
    .ghost { font-size: 48px; }
    h1 { color: #b86cff; margin: 10px 0; }
    .sub { color: #9ca3af; font-size: 13px; }
    main { padding: 22px 18px; max-width: 460px; margin: auto; }
    .card {
      background: #111723;
      border: 1px solid #293347;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }
    h2 { font-size: 18px; margin-top: 0; }
    p { color: #c4cad5; font-size: 14px; line-height: 1.5; }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 1px solid #a855f7;
      border-radius: 10px;
      background: #8b35d1;
      color: white;
      font-size: 15px;
      font-weight: bold;
    }
    button:active { transform: scale(.98); }
    .secondary { background: #171e2c; }
    #mensagem { color: #d8b4fe; min-height: 20px; }
    footer { padding: 20px; color: #727b8c; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="ghost">👻</div>
    <h1>GHOST MODS V1</h1>
    <div class="sub">PAINEL GAMER • FREE FIRE</div>
  </header>

  <main>
    <section class="card">
      <h2>🔥 BEM-VINDO, JOGADOR</h2>
      <p>Seu espaço gamer está pronto para começar.</p>
      <button onclick="mostrar('Bem-vindo ao GHOST MODS V1!')">
        ENTRAR NO PAINEL
      </button>
    </section>

    <section class="card">
      <h2>🎯 ÁREA DE CONFIGURAÇÕES</h2>
      <p>Consulte suas preferências e organize suas configurações de jogo.</p>
      <button onclick="mostrar('Você pode personalizar suas configurações de jogo aqui.')">
        CONFIGURAÇÕES
      </button>
      <button class="secondary" onclick="mostrar('Área de perfil selecionada!')">
        MEU PERFIL
      </button>
    </section>

    <section class="card">
      <h2>👻 GHOST MODS</h2>
      <p id="mensagem">Selecione uma opção acima.</p>
    </section>
  </main>

  <footer>GHOST MODS V1 • Projeto independente de fãs</footer>

  <script>
    function mostrar(texto) {
      document.getElementById('mensagem').textContent = texto;
    }
  </script>
</body>
</html>
