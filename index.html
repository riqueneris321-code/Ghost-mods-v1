
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080610">
<title>GHOST MODS V1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080610;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:25px 12px;background:linear-gradient(135deg,#241039,#090811);border-bottom:2px solid #a855f7}
.ghost{font-size:44px}
h1{color:#d8a5ff;text-shadow:0 0 15px #a855f7;margin:8px}
.sub{color:#c4b5d8;font-size:12px;letter-spacing:2px}
main{max-width:480px;margin:auto;padding:16px}
.card{background:#151020;border:1px solid #49305e;border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 0 12px #a855f711}
h2{font-size:18px;margin-top:0}
p{font-size:14px;line-height:1.5;color:#c4b5d8}
button,input,select{width:100%;padding:13px;margin-top:9px;border-radius:9px;font-size:14px}
button{background:linear-gradient(100deg,#7024b7,#a832d8);border:1px solid #c084fc;color:white;font-weight:bold;cursor:pointer}
.secondary{background:#21172e;border-color:#49305e}
input,select{background:#0c0913;border:1px solid #49305e;color:white}
label{display:block;margin-top:13px;color:#e5caff;font-size:13px}
.hidden{display:none!important}
.status{color:#d8b4fe;min-height:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid button{margin-top:0;min-height:60px}
footer{text-align:center;color:#82758f;padding:20px;font-size:11px}
</style>
</head>
<body>
<header>
<div class="ghost">👻</div>
<h1>GHOST MODS V1</h1>
<div class="sub">GAMING CONFIGURATION</div>
</header>

<main>
<section id="home" class="card">
<h2>🔥 BEM-VINDO, JOGADOR</h2>
<p>Seu espaço gamer personalizado.</p>
<label for="game">Selecione a versão</label>
<select id="game" onchange="changeGame()">
<option value="ff">Free Fire</option>
<option value="max">Free Fire MAX</option>
</select>
<button onclick="openPage('panel')">ENTRAR NO PAINEL</button>
<button class="secondary" onclick="openPage('profile')">👤 MEU PERFIL</button>
</section>

<section id="panel" class="card hidden">
<h2>👻 PAINEL PRINCIPAL</h2>
<p id="gameName">Free Fire</p>
<div class="grid">
<button onclick="openFeature('AIMBOT')">🎯 AIMBOT</button>
<button onclick="openFeature('AIMKILL')">🔥 AIMKILL</button>
<button onclick="openFeature('AIMCOVER')">🛡️ AIMCOVER</button>
<button onclick="openFeature('ESP')">👁️ ESP</button>
<button onclick="openFeature('ESP LINE')">📐 ESP LINE</button>
<button onclick="openFeature('ESP BOX')">▣ ESP BOX</button>
</div>
<button onclick="openPage('settings')">⚙️ SENSIBILIDADE E DPI</button>
<button class="secondary" onclick="openPage('home')">VOLTAR AO INÍCIO</button>
</section>

<section id="feature" class="card hidden">
<h2 id="featureTitle">OPÇÃO</h2>
<p id="featureDescription"></p>
<div id="demoArea"></div>
<button class="secondary" onclick="openPage('panel')">VOLTAR AO PAINEL</button>
</section>

<section id="settings" class="card hidden">
<h2>🎯 SENSIBILIDADE E DPI</h2>
<p>Perfil separado para cada versão do jogo.</p>
<label for="general">Sensibilidade geral (0–200)</label>
<input id="general" type="number" min="0" max="200">
<label for="redDot">Ponto vermelho (0–200)</label>
<input id="redDot" type="number" min="0" max="200">
<label for="scope2">Mira 2x (0–200)</label>
<input id="scope2" type="number" min="0" max="200">
<label for="scope4">Mira 4x (0–200)</label>
<input id="scope4" type="number" min="0" max="200">
<label for="awm">Mira AWM (0–200)</label>
<input id="awm" type="number" min="0" max="200">
<label for="dpi">DPI do aparelho (opcional)</label>
<input id="dpi" type="number" min="1" max="2000">
<button onclick="saveSettings()">💾 SALVAR CONFIGURAÇÕES</button>
<p id="settingsStatus" class="status"></p>
<button class="secondary" onclick="openPage('panel')">VOLTAR</button>
</section>

<section id="profile" class="card hidden">
<h2>👤 MEU PERFIL</h2>
<label for="nick">Nome de jogador</label>
<input id="nick" maxlength="30" placeholder="Seu nick">
<label for="style">Estilo de jogo</label>
<select id="style">
<option>Equilibrado</option>
<option>Precisão</option>
<option>Agressivo</option>
</select>
<button onclick="saveProfile()">SALVAR PERFIL</button>
<p id="profileStatus" class="status"></p>
<button class="secondary" onclick="openPage('home')">VOLTAR</button>
</section>
</main>

<footer>GHOST MODS V1 • Projeto independente de fãs</footer>

<script>
let currentGame='ff';
const fields=['general','redDot','scope2','scope4','awm','dpi'];

function readData(key,fallback){
  try{
    const value=localStorage.getItem(key);
    return value ? JSON.parse(value) : fallback;
  }catch(e){return fallback;}
}

function writeData(key,value){
  try{
    localStorage.setItem(key,JSON.stringify(value));
    return true;
  }catch(e){return false;}
}

function changeGame(){
  currentGame=document.getElementById('game').value;
  document.getElementById('gameName').textContent=
    currentGame==='max'?'Free Fire MAX':'Free Fire';
  loadSettings();
}

function openPage(id){
  ['home','panel','feature','settings','profile'].forEach(function(page){
    document.getElementById(page).classList.add('hidden');
  });
  document.getElementById(id).classList.remove('hidden');
  if(id==='settings')loadSettings();
  if(id==='profile')loadProfile();
  window.scrollTo({top:0,behavior:'smooth'});
}

function openFeature(name){
  document.getElementById('featureTitle').textContent='👻 '+name;
  document.getElementById('featureDescription').textContent=
    'Área demonstrativa do '+name+'. Esta opção não modifica nem controla o Free Fire.';
  document.getElementById('demoArea').innerHTML=
    '<p>GHOST MODS V1 • '+name+'</p>'+
    '<button type="button" onclick="demoMessage()">VER STATUS</button>'+
    '<p id="demoStatus" class="status"></p>';
  openPage('feature');
}

function demoMessage(){
  document.getElementById('demoStatus').textContent=
    'Modo de demonstração selecionado. Nenhuma alteração foi feita no jogo.';
}

function loadSettings(){
  const data=readData('ghost_'+currentGame,{});
  fields.forEach(function(field){
    document.getElementById(field).value=
      data[field]===undefined?'':data[field];
  });
}

function saveSettings(){
  const data={};
  for(const field of fields){
    const input=document.getElementById(field);
    const raw=input.value.trim();
    if(raw===''){data[field]='';continue;}
    const value=Number(raw);
    const min=field==='dpi'?1:0;
    const max=field==='dpi'?2000:200;
    if(!Number.isFinite(value)||value<min||value>max){
      document.getElementById('settingsStatus').textContent=
        'Confira os valores. Sensibilidade: 0–200; DPI: 1–2000.';
      return;
    }
    data[field]=value;
  }
  document.getElementById('settingsStatus').textContent=
    writeData('ghost_'+currentGame,data)
    ?'✅ Preferências salvas neste navegador!'
    :'Não foi possível salvar neste navegador.';
}

function loadProfile(){
  const data=readData('ghost_profile',{});
  document.getElementById('nick').value=data.nick||'';
  document.getElementById('style').value=data.style||'Equilibrado';
}

function saveProfile(){
  const nick=document.getElementById('nick').value.trim();
  if(!nick){
    document.getElementById('profileStatus').textContent='Digite seu nick.';
    return;
  }
  const ok=writeData('ghost_profile',{
    nick:nick,
    style:document.getElementById('style').value
  });
  document.getElementById('profileStatus').textContent=
    ok?'✅ Perfil salvo!':'Não foi possível salvar o perfil.';
}

changeGame();
</script>
</body>
</html>
